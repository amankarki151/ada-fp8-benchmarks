<title id="t">Blockwise FP8 CUTLASS vs Marlin on an NVIDIA L4, Qwen3-8B layers</title>
<desc id="d">Speedup over Marlin (Marlin time divided by blockwise CUTLASS time including activation quantization) for qkv_proj, o_proj, gate_up_proj and down_proj at M from 1 to 4096. Full numbers in results/blockwise-fp8-l4-2026-10-10/gemm_bench.csv.</desc>
